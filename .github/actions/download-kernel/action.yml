name: 'Download Kernel Repository'
description: 'Initialize and sync Android kernel source repository'

inputs:
  android_version:
    description: 'Android version (e.g., android14)'
    required: true

  kernel_version:
    description: 'Kernel version (e.g., 5.15, 6.1)'
    required: true

  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true

  os_patch_level:
    description: 'OS patch level (e.g., 2024-01)'
    required: true

outputs:
  deprecated_branch:
    description: 'Whether the kernel branch is deprecated'
    value: ${{ steps.sync.outputs.deprecated }}

  tag_fallback:
    description: 'Release tag used when an exact tag is selected or branch fallback is required'
    value: ${{ steps.sync.outputs.tag_fallback }}

runs:
  using: composite

  steps:
    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/kernel

      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${{ inputs.os_patch_level }}"

        echo "======================================================"
        echo "[+] VERSION          : ${VERSION}"
        echo "[+] ANDROID_PART     : ${ANDROID_PART}"
        echo "[+] KERNEL_PART      : ${KERNEL_PART}"
        echo "[+] FORMATTED_BRANCH : ${FORMATTED_BRANCH}"
        echo "======================================================"

        init_repo() {
          local depth="$1"
          local depth_flag=""

          if [ "$depth" != "0" ]; then
            depth_flag="--depth=${depth}"
          fi

          echo "[+] Initializing Google kernel manifest..."

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-${FORMATTED_BRANCH} \
            ${depth_flag} || {
              echo "ERROR: repo init failed" >&2
              return 1
            }

          DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"

          REMOTE_BRANCH=$(
            git ls-remote \
              https://android.googlesource.com/kernel/common \
              "refs/heads/${FORMATTED_BRANCH}" \
              2>/dev/null || true
          )

          DEPRECATED_BRANCH=$(
            git ls-remote \
              https://android.googlesource.com/kernel/common \
              "refs/heads/deprecated/${FORMATTED_BRANCH}" \
              2>/dev/null || true
          )

          DEPRECATED=false

          if [ -z "$REMOTE_BRANCH" ] && [ -n "$DEPRECATED_BRANCH" ]; then
            echo "[!] Branch ${FORMATTED_BRANCH} is deprecated."

            sed -i \
              "s|revision=\"${FORMATTED_BRANCH}\"|revision=\"deprecated/${FORMATTED_BRANCH}\"|g" \
              "$DEFAULT_MANIFEST_PATH"

            DEPRECATED=true
          fi

          echo "deprecated=$DEPRECATED" >> "$GITHUB_OUTPUT"

          TAG_FALLBACK=""

          # Generic fallback for deleted monthly branches.
          if [ "$DEPRECATED" = "false" ] && [ -z "$REMOTE_BRANCH" ]; then
            LATEST_TAG=$(
              git ls-remote \
                https://android.googlesource.com/kernel/common \
                "refs/tags/${FORMATTED_BRANCH}_r*" \
                2>/dev/null |
              awk '{print $2}' |
              grep -v '\^{}$' |
              sed 's|refs/tags/||' |
              awk -F'_r' '{print $NF+0, $0}' |
              sort -n |
              tail -n 1 |
              cut -d' ' -f2- || true
            )

            if [ -n "$LATEST_TAG" ]; then
              echo "[!] Branch head missing; fallback tag found: ${LATEST_TAG}"

              sed -i \
                "/path=\"common\"/ s|revision=\"[^\"]*\"|revision=\"refs/tags/${LATEST_TAG}\"|" \
                "$DEFAULT_MANIFEST_PATH"

              TAG_FALLBACK="$LATEST_TAG"
            else
              echo "ERROR: no branch or fallback tag found for ${FORMATTED_BRANCH}" >&2
              return 1
            fi
          fi

          echo "tag_fallback=$TAG_FALLBACK" >> "$GITHUB_OUTPUT"
        }

        MAX_RETRIES=3
        RETRY_DELAY_SHORT=15
        SYNC_TIMEOUT="15m"
        DEPTHS=(1 1 1)
        attempt=1

        clean_workspace() {
          echo "Disk before cleanup:"
          df -h "$PWD" | tail -n +2 || true

          find "$PWD" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf {} +

          echo "Disk after cleanup:"
          df -h "$PWD" | tail -n +2 || true
        }

        while [ $attempt -le $MAX_RETRIES ]; do
          CURRENT_DEPTH="${DEPTHS[$((attempt-1))]}"

          echo ""
          echo "======================================================"
          echo "[+] Sync attempt $attempt/$MAX_RETRIES"
          echo "[+] Depth: ${CURRENT_DEPTH}"
          echo "======================================================"

          if init_repo "$CURRENT_DEPTH"; then
            SYNC_TAG_FLAGS="--no-tags"

            if [ -n "${TAG_FALLBACK:-}" ]; then
              SYNC_TAG_FLAGS=""
            fi

            if timeout "$SYNC_TIMEOUT" \
              repo sync \
                -c \
                --current-branch \
                --no-clone-bundle \
                $SYNC_TAG_FLAGS \
                --jobs-checkout=4 \
                -j4; then

              echo ""
              echo "======================================================"
              echo "[+] Repository sync completed successfully"
              echo "======================================================"
              break
            else
              rc=$?

              if [ "$rc" -eq 124 ]; then
                echo "ERROR: repo sync timed out after ${SYNC_TIMEOUT}" >&2
              else
                echo "ERROR: repo sync failed with exit code ${rc}" >&2
              fi
            fi
          else
            rc=$?
            echo "ERROR: repo initialization failed with exit code ${rc}" >&2
          fi

          if [ $attempt -lt $MAX_RETRIES ]; then
            echo "[!] Cleaning workspace and retrying..."
            clean_workspace || true
            sleep "$RETRY_DELAY_SHORT"
          else
            echo "ERROR: all $MAX_RETRIES sync attempts failed" >&2
            exit "$rc"
          fi

          attempt=$((attempt+1))
        done

        # ==========================================================
        # itel A675L exact GKI r8 pin
        # ==========================================================

        if [ "$FORMATTED_BRANCH" = "android13-5.15-2025-09" ]; then
          PINNED_TAG="android13-5.15-2025-09_r8"
          PINNED_REF="refs/tags/${PINNED_TAG}"
          EXPECTED_SHA="aa2747a3794a9708575639d3e287b6dc91331dee"

          echo ""
          echo "======================================================"
          echo "[+] itel A675L exact GKI target detected"
          echo "[+] Target tag   : ${PINNED_TAG}"
          echo "[+] Target ref   : ${PINNED_REF}"
          echo "[+] Expected SHA : ${EXPECTED_SHA}"
          echo "[+] Expected BID : 14413887"
          echo "======================================================"

          if [ ! -d common ]; then
            echo "ERROR: kernel/common directory does not exist" >&2
            exit 1
          fi

          cd common

          echo "[+] Fetching exact GKI r8 tag..."

          git fetch \
            --depth=1 \
            https://android.googlesource.com/kernel/common \
            "${PINNED_REF}" || {
              echo "ERROR: failed to fetch ${PINNED_REF}" >&2
              exit 1
            }

          echo "[+] Checking out exact r8 commit..."

          git checkout --detach FETCH_HEAD || {
            echo "ERROR: failed to checkout ${PINNED_TAG}" >&2
            exit 1
          }

          ACTUAL_SHA=$(git rev-parse HEAD)

          echo ""
          echo "[+] kernel/common HEAD after r8 checkout:"
          echo "    ${ACTUAL_SHA}"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo ""
            echo "======================================================" >&2
            echo "ERROR: wrong kernel/common commit" >&2
            echo "Expected: ${EXPECTED_SHA}" >&2
            echo "Actual  : ${ACTUAL_SHA}" >&2
            echo "======================================================" >&2
            exit 1
          fi

          echo ""
          echo "======================================================"
          echo "[+] SUCCESS"
          echo "[+] Exact itel A675L GKI r8 base confirmed"
          echo "[+] Tag : ${PINNED_TAG}"
          echo "[+] SHA : ${ACTUAL_SHA}"
          echo "[+] BID : 14413887"
          echo "======================================================"

          echo "KERNEL_SOURCE_COMMIT=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "tag_fallback=${PINNED_TAG}" >> "$GITHUB_OUTPUT"

          cd ..
        fi


    - name: Capture Kernel Common Commit Metadata
      shell: bash
      working-directory: ${{ github.workspace }}/kernel

      run: |
        set -euo pipefail

        if [ ! -d common ]; then
          echo "ERROR: common directory not found" >&2
          exit 1
        fi

        cd common

        COMMIT_DATE=$(git log -1 --format=%cI)
        COMMIT_MSG=$(git log -1 --format=%s)
        COMMIT_SHA=$(git rev-parse HEAD)

        echo "KERNEL_SOURCE_COMMIT=${COMMIT_SHA}" >> "$GITHUB_ENV"

        echo ""
        echo "======================================================"
        echo "Kernel common commit date : ${COMMIT_DATE}"
        echo "Kernel common commit msg  : ${COMMIT_MSG}"
        echo "Kernel common commit SHA  : ${COMMIT_SHA}"
        echo "======================================================"

        if [ "${{ inputs.version }}" = "android13-5.15" ] && \
           [ "${{ inputs.os_patch_level }}" = "2025-09" ]; then

          EXPECTED_SHA="aa2747a3794a9708575639d3e287b6dc91331dee"

          if [ "$COMMIT_SHA" = "$EXPECTED_SHA" ]; then
            echo ""
            echo "======================================================"
            echo "[+] FINAL VERIFICATION PASSED"
            echo "[+] Exact A675L GKI r8 source is active"
            echo "[+] SHA: ${COMMIT_SHA}"
            echo "======================================================"
          else
            echo ""
            echo "======================================================" >&2
            echo "ERROR: final r8 verification failed" >&2
            echo "Expected: ${EXPECTED_SHA}" >&2
            echo "Actual  : ${COMMIT_SHA}" >&2
            echo "======================================================" >&2
            exit 1
          fi
        fi
