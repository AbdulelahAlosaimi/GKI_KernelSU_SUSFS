name: 'Download Kernel Repository'
description: 'Initialize and sync Android kernel source repository'

inputs:
  android_version:
    description: 'Android version (e.g., android14)'
    required: true

  kernel_version:
    description: 'Kernel version (e.g., 5.15, 6.1)'
    required: true

  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true

  os_patch_level:
    description: 'OS patch level (e.g., 2024-01)'
    required: true

outputs:
  deprecated_branch:
    description: 'Whether the kernel branch is deprecated'
    value: ${{ steps.sync.outputs.deprecated }}

  tag_fallback:
    description: 'Release tag used when the branch head was missing upstream'
    value: ${{ steps.sync.outputs.tag_fallback }}

runs:
  using: composite

  steps:
    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/kernel

      run: |
        set -euo pipefail

        # ----------------------------------------------------------
        # Derive Android / kernel version
        # Example:
        # VERSION=android13-5.15
        # FORMATTED_BRANCH=android13-5.15-2025-09
        # ----------------------------------------------------------

        VERSION="${{ inputs.version }}"

        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)

        FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${{ inputs.os_patch_level }}"

        echo "======================================================"
        echo "[+] VERSION          : $VERSION"
        echo "[+] ANDROID_PART     : $ANDROID_PART"
        echo "[+] KERNEL_PART      : $KERNEL_PART"
        echo "[+] FORMATTED_BRANCH : $FORMATTED_BRANCH"
        echo "======================================================"

        init_repo() {

          local depth="$1"
          local depth_flag=""

          if [ "$depth" != "0" ]; then
            depth_flag="--depth=${depth}"
          fi

          # --------------------------------------------------------
          # Initialize Google's kernel manifest
          # --------------------------------------------------------

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-${FORMATTED_BRANCH} \
            ${depth_flag} || {
              echo "ERROR: repo init failed" >&2
              return 1
            }

          # --------------------------------------------------------
          # Check whether normal branch still exists
          # --------------------------------------------------------

          REMOTE_BRANCH=$(
            git ls-remote \
              https://android.googlesource.com/kernel/common \
              "refs/heads/${FORMATTED_BRANCH}" \
              2>/dev/null || true
          )

          DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"

          DEPRECATED=false

          # --------------------------------------------------------
          # Check deprecated branch
          # --------------------------------------------------------

          DEPRECATED_BRANCH=$(
            git ls-remote \
              https://android.googlesource.com/kernel/common \
              "refs/heads/deprecated/${FORMATTED_BRANCH}" \
              2>/dev/null || true
          )

          if [ -z "$REMOTE_BRANCH" ] && [ -n "$DEPRECATED_BRANCH" ]; then

            echo "[!] Branch ${FORMATTED_BRANCH} is deprecated."

            sed -i \
              "s|revision=\"${FORMATTED_BRANCH}\"|revision=\"deprecated/${FORMATTED_BRANCH}\"|g" \
              "$DEFAULT_MANIFEST_PATH"

            DEPRECATED=true

          fi

          echo "deprecated=$DEPRECATED" >> "$GITHUB_OUTPUT"

          TAG_FALLBACK=""

          # ========================================================
          #
          # itel A675L exact stock GKI base
          #
          # Stock uname:
          #
          # 5.15.189-android13-8-00013-gaa2747a3794a-ab14413887
          #
          # Exact Google GKI release:
          #
          # android13-5.15-2025-09_r8
          #
          # Exact common commit:
          #
          # aa2747a3794a9708575639d3e287b6dc91331dee
          #
          # Google Build ID:
          #
          # 14413887
          #
          # ========================================================

          if [ "$FORMATTED_BRANCH" = "android13-5.15-2025-09" ]; then

            PINNED_TAG="android13-5.15-2025-09_r8"

            PINNED_REF="refs/tags/${PINNED_TAG}"

            EXPECTED_SHA="aa2747a3794a9708575639d3e287b6dc91331dee"

            echo ""
            echo "======================================================"
            echo "[+] itel A675L exact GKI build detected"
            echo "[+] Kernel branch : ${FORMATTED_BRANCH}"
            echo "[+] Pinning tag   : ${PINNED_TAG}"
            echo "[+] Pinning ref   : ${PINNED_REF}"
            echo "[+] Expected SHA  : ${EXPECTED_SHA}"
            echo "[+] Expected BID  : 14413887"
            echo "======================================================"
            echo ""

            # ------------------------------------------------------
            # Make sure the exact tag exists upstream
            # ------------------------------------------------------

            PINNED_REMOTE=$(
              git ls-remote \
                https://android.googlesource.com/kernel/common \
                "${PINNED_REF}" \
                2>/dev/null || true
            )

            if [ -z "$PINNED_REMOTE" ]; then

              echo "ERROR: Required GKI tag was not found:" >&2
              echo "${PINNED_REF}" >&2

              return 1

            fi

            echo "[+] Exact r8 tag exists upstream."

            # ------------------------------------------------------
            # IMPORTANT:
            #
            # Use absolute refs/tags/... rather than just:
            #
            # android13-5.15-2025-09_r8
            #
            # Otherwise repo may interpret it as refs/heads/...
            # ------------------------------------------------------

            sed -i \
              "/path=\"common\"/ s|revision=\"[^\"]*\"|revision=\"${PINNED_REF}\"|" \
              "$DEFAULT_MANIFEST_PATH"

            TAG_FALLBACK="$PINNED_TAG"

            echo "[+] kernel/common manifest revision changed to:"
            echo "    ${PINNED_REF}"

          elif [ "$DEPRECATED" = "false" ] && [ -z "$REMOTE_BRANCH" ]; then

            # ------------------------------------------------------
            # Google sometimes retires monthly branch heads.
            #
            # In that case, find latest immutable release tag.
            # ------------------------------------------------------

            LATEST_TAG=$(
              git ls-remote \
                https://android.googlesource.com/kernel/common \
                "refs/tags/${FORMATTED_BRANCH}_r*" \
                2>/dev/null |
              awk '{print $2}' |
              grep -v '\^{}$' |
              sed 's|refs/tags/||' |
              awk -F'_r' '{print $NF+0, $0}' |
              sort -n |
              tail -n 1 |
              cut -d' ' -f2- || true
            )

            if [ -n "$LATEST_TAG" ]; then

              LATEST_REF="refs/tags/${LATEST_TAG}"

              echo "[!] Branch ${FORMATTED_BRANCH} head missing upstream."
              echo "[!] Using immutable tag:"
              echo "    ${LATEST_REF}"

              sed -i \
                "/path=\"common\"/ s|revision=\"[^\"]*\"|revision=\"${LATEST_REF}\"|" \
                "$DEFAULT_MANIFEST_PATH"

              TAG_FALLBACK="$LATEST_TAG"

            else

              echo "WARNING: no branch or tag found for ${FORMATTED_BRANCH}." >&2
              echo "repo sync will likely fail." >&2

            fi
          fi

          echo "tag_fallback=$TAG_FALLBACK" >> "$GITHUB_OUTPUT"

          # --------------------------------------------------------
          # Debug manifest entry for kernel/common
          # --------------------------------------------------------

          echo ""
          echo "================ Manifest common entry ==============="

          grep 'path="common"' "$DEFAULT_MANIFEST_PATH" || true

          echo "======================================================"
          echo ""
        }


        # ==========================================================
        # Retry configuration
        # ==========================================================

        MAX_RETRIES=3

        RETRY_DELAY_SHORT=15

        SYNC_TIMEOUT="15m"

        attempt=1


        # ----------------------------------------------------------
        # Always shallow.
        # ----------------------------------------------------------

        DEPTHS=(1 1 1)


        clean_workspace() {

          echo "Disk before cleanup:"

          df -h "$PWD" | tail -n +2 || true

          # Remove repo metadata and incomplete checkouts.

          find "$PWD" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf {} +

          echo "Disk after cleanup:"

          df -h "$PWD" | tail -n +2 || true
        }


        # ==========================================================
        # Sync
        # ==========================================================

        while [ $attempt -le $MAX_RETRIES ]; do

          CURRENT_DEPTH="${DEPTHS[$((attempt-1))]}"

          echo ""
          echo "======================================================"

          echo "Attempt $attempt/$MAX_RETRIES"

          echo "depth=${CURRENT_DEPTH}"

          echo "sync timeout=${SYNC_TIMEOUT}"

          echo "======================================================"

          df -h "$PWD" | tail -n +2 || true


          if init_repo "$CURRENT_DEPTH"; then

            # ------------------------------------------------------
            # Default branch builds can skip tags.
            #
            # Pinned r8 / fallback tag requires tag refs.
            # ------------------------------------------------------

            SYNC_TAG_FLAGS="--no-tags"

            if [ -n "$TAG_FALLBACK" ]; then

              SYNC_TAG_FLAGS=""

              echo "[+] Tag-based revision detected."
              echo "[+] Tag fetching enabled."

            fi


            if timeout "$SYNC_TIMEOUT" \
              repo sync \
                -c \
                --current-branch \
                --no-clone-bundle \
                $SYNC_TAG_FLAGS \
                --jobs-checkout=4 \
                -j4; then

              echo ""
              echo "======================================================"
              echo "[+] Kernel repository sync succeeded"
              echo "======================================================"
              echo ""

              break

            else

              rc=$?

              if [ "$rc" -eq 124 ]; then

                echo "repo sync timed out after ${SYNC_TIMEOUT}."

              else

                echo "repo sync failed with exit code ${rc}."

              fi

            fi

          else

            rc=$?

            echo "repo init / branch setup failed with exit code ${rc}."

          fi


          if [ $attempt -lt $MAX_RETRIES ]; then

            echo ""
            echo "Cleaning workspace and retrying after ${RETRY_DELAY_SHORT}s..."

            clean_workspace || true

            sleep "$RETRY_DELAY_SHORT"

          else

            echo "All $MAX_RETRIES attempts failed." >&2

            exit "$rc"

          fi

          attempt=$((attempt+1))

        done


    # ==============================================================
    # Capture and verify kernel/common commit
    # ==============================================================

    - name: Capture Kernel Common Commit Metadata
      shell: bash
      working-directory: ${{ github.workspace }}/kernel

      run: |
        set -euo pipefail

        if [[ ! -d common ]]; then

          echo "ERROR: common folder not found." >&2

          exit 1

        fi


        cd common


        if [[ ! -d .git ]]; then

          echo "ERROR: common is not a git checkout." >&2

          exit 1

        fi


        COMMIT_DATE=$(git log -1 --format=%cI)

        COMMIT_MSG=$(git log -1 --format=%s)

        COMMIT_SHA=$(git rev-parse HEAD)


        echo "KERNEL_SOURCE_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"


        echo ""
        echo "======================================================"

        echo "Kernel common commit date: $COMMIT_DATE"

        echo "Kernel common commit msg : $COMMIT_MSG"

        echo "Kernel common commit SHA : $COMMIT_SHA"

        echo "======================================================"
        echo ""


        EXPECTED_SHA="aa2747a3794a9708575639d3e287b6dc91331dee"


        # ----------------------------------------------------------
        # Only enforce the exact SHA for our A675L target.
        # ----------------------------------------------------------

        if [ "${{ inputs.version }}" = "android13-5.15" ] && \
           [ "${{ inputs.os_patch_level }}" = "2025-09" ]; then

          echo "[+] Verifying exact itel A675L GKI r8 commit..."

          if [ "$COMMIT_SHA" = "$EXPECTED_SHA" ]; then

            echo ""
            echo "======================================================"
            echo "[+] SUCCESS"
            echo "[+] Exact itel A675L GKI r8 base confirmed"
            echo "[+] SHA : $COMMIT_SHA"
            echo "[+] BID : 14413887"
            echo "======================================================"
            echo ""

          else

            echo ""
            echo "======================================================" >&2
            echo "[!] ERROR: Wrong kernel/common revision" >&2
            echo "[!] Expected: $EXPECTED_SHA" >&2
            echo "[!] Actual  : $COMMIT_SHA" >&2
            echo "======================================================" >&2
            echo ""

            exit 1

          fi

        else

          echo "[+] Non-A675L target."
          echo "[+] Exact r8 SHA verification skipped."

        fi
