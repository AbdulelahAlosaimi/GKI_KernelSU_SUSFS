name: Setup Wild KSU
description: Download and configure KernelSU-Next official with version tracking

inputs:
  ksu_branch:
    description: 'KernelSU-Next tag or commit (empty = v3.3.0 / 33214)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download KernelSU-Next
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_INPUT="${{ inputs.ksu_branch }}"

        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="v3.3.0"
        fi

        echo "Using official KernelSU-Next: $KSU_INPUT"

        curl -LSs \
          --retry 5 \
          --retry-delay 5 \
          --retry-all-errors \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.3.0/kernel/setup.sh" \
          | bash -s "$KSU_INPUT"

        echo "KernelSU-Next installed using official setup.sh"

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail

        KSU_GIT_TAG="v3.3.0"

        KSU_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "3214")
        KSU_VERSION=$((30000 + COMMITS_COUNT))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

        echo "KernelSU-Next info:"
        echo "Tag: $KSU_GIT_TAG"
        echo "Version: $KSU_VERSION"
        echo "Commit: $KSU_COMMIT"

    - name: Fix KernelSU-Next
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail

        cp "${{ github.action_path }}/patches/static.patch" \
           "${{ github.workspace }}/kernel/KernelSU-Next/static.patch"

        patch -p1 < static.patch

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
